server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the browser's host:port in redirects (container listens on 80,
    # but is published on 8080).
    absolute_redirect off;

    # ---- Paths used by the BlueOS build of the logviewer ----------------------
    # /extensionv2/mbtiles/services/custom/tiles/{z}/{x}/{y}.png -> the tile server (mbtiles)
    location /extensionv2/mbtiles/ {
        proxy_pass http://mbtiles:8000/;
    }
    # /extensionv2/terrain/quantized/layer.json -> terrain container
    location /extensionv2/terrain/ {
        proxy_pass http://terrain:80/;
    }

    # ---- Paths used by the local build (/tiles/, /quantized/) -----------------
    location /tiles/ {
        proxy_pass http://mbtiles:8000/services/custom/tiles/;
    }
    location /quantized/ {
        proxy_pass http://terrain:80/quantized/;
    }

    # the app (single-page app fallback) - MUST be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
