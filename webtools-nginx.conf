server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # WebTools links are "./FilterReview" (no trailing slash). nginx answers
    # with a redirect to "/FilterReview/"; by default that redirect is absolute
    # and uses the container's port 80, which drops the published :8090.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
